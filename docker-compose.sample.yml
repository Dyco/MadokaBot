version: "3"

services:
  nonebot:
    build: .
    image: madokabot:latest
    container_name: MadokaBot
    ports:
      - "8080:8080"
    env_file:
      - .env.prod
    volumes:
      - ./assets:/app/assets
    environment:
      ENVIRONMENT: prod
      HOST: 0.0.0.0
      PORT: 8080
    restart: always