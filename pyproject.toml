[project]
name = "MadokaBot"
version = "0.2.1"
description = "MadokaBot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[aiohttp]>=2.4.4",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-adapter-console>=0.9.0",
    "nonebot-plugin-status>=0.9.0",
    "nonebot-plugin-alconna>=0.60.3",
    "nonebot-plugin-htmlrender>=0.6.7",
    "nonebot-plugin-datastore>=1.3.1",
    "nonebot-plugin-localstore>=0.7.4",
    "httpx[socks]>=0.28.1",
    "beautifulsoup4>=4.14.3",
    "Jinja2>=3.1.6",
    "pydantic>=2.12.5,<3.0.0",
    "sqlalchemy>=2.0.45",
    "Pillow>=10.2.0",
    "pytz>=2024.2",
    "numpy>=1.24.4",
    "nonebot-plugin-apscheduler>=0.5.0",
    "bilibili-api-python>=16.2.0",
    "PyExecJS>=1.5.1",
    "yt-dlp>=2024.11.18",
    "arrow>=1.3.0",
    "async-timeout>=4.0.3",
    "bbcode>=1.1.0",
    "cachetools>=5.5.2",
    "emoji>=2.15.0",
    "feedparser>=6.0.11",
    "ImageHash>=4.3.2",
    "pyquery>=2.1.0",
    "tenacity>=8.5.0",
    "tinydb>=4.9.0",
]

[project.optional-dependencies]
dev = [
    
]

[tool.nonebot]
plugin_dirs = ["madokabot"]
builtin_plugins = []


[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-htmlrender = ["nonebot_plugin_htmlrender"]
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]
nonebot-plugin-status = ["nonebot_plugin_status"]
nonebot-plugin-alconna = ["nonebot_plugin_alconna"]
nonebot-plugin-localstore = ["nonebot_plugin_localstore"]
