<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: "CustomFont";
            src: url("{{ font_path }}");
        }

        html,
        body {
            width: 1320px;
            height: 2868px;
            margin: 0;
            overflow: hidden;
            background: #ffffff;
        }

        body {
            font-family: "CustomFont", sans-serif;
        }

        canvas {
            display: block;
            width: 1320px;
            height: 2868px;
        }

        #source-image {
            display: none;
        }
    </style>
</head>
<body>
    <img id="source-image" src="{{ image_data_url }}" alt="">
    <canvas id="trackpic-canvas" width="1320" height="2868"></canvas>

    <script>
        const titleText = {{ title | tojson }};
        const artistText = {{ subtitle | tojson }};
        const palette = {{ palette | tojson }};
        const signature = {{ signature | tojson }};

        const canvas = document.getElementById("trackpic-canvas");
        const sourceImage = document.getElementById("source-image");
        const ctx = canvas.getContext("2d");

        const DEFAULT_PALETTE = [
            "#4A6370",
            "#73A0B1",
            "#98B6BE",
            "#BDCBCC",
            "#EBF1F2",
        ];

        function spacedWidth(text, gap) {
            if (!text) return 0;
            let width = 0;
            for (let index = 0; index < text.length; index += 1) {
                width += ctx.measureText(text[index]).width;
                if (index < text.length - 1) width += gap;
            }
            return width;
        }

        function drawSpacedText(text, x, y, gap) {
            let cursor = x;
            for (const character of text) {
                ctx.fillText(character, cursor, y);
                cursor += ctx.measureText(character).width + gap;
            }
        }

        function fitText(text, maxWidth, gap) {
            let result = text || "Untitled";
            while (result.length > 0 && spacedWidth(`${result}...`, gap) > maxWidth) {
                result = result.slice(0, -1);
            }
            return result === text ? result : `${result}...`;
        }

        function drawHeartIcon(x, y, color, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3.6;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();
            ctx.moveTo(18, 9);
            ctx.bezierCurveTo(18, 4, 13.5, 0, 8.5, 0);
            ctx.bezierCurveTo(3.8, 0, 0, 3.8, 0, 8.5);
            ctx.bezierCurveTo(0, 15, 7.5, 21.5, 18, 30);
            ctx.bezierCurveTo(28.5, 21.5, 36, 15, 36, 8.5);
            ctx.bezierCurveTo(36, 3.8, 32.2, 0, 27.5, 0);
            ctx.bezierCurveTo(22.5, 0, 18, 4, 18, 9);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        function drawPrevIcon(centerX, centerY, color, scale) {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(scale, scale);
            ctx.fillStyle = color;
            ctx.fillRect(-22, -20, 5.5, 40);
            ctx.beginPath();
            ctx.moveTo(-14, 0);
            ctx.lineTo(16, -20);
            ctx.lineTo(16, 20);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawNextIcon(centerX, centerY, color, scale) {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(scale, scale);
            ctx.fillStyle = color;
            ctx.fillRect(16.5, -20, 5.5, 40);
            ctx.beginPath();
            ctx.moveTo(14, 0);
            ctx.lineTo(-16, -20);
            ctx.lineTo(-16, 20);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawShuffleIcon(centerX, centerY, color, scale) {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(scale, scale);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4.5;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            ctx.beginPath();
            ctx.moveTo(-24, -14);
            ctx.lineTo(-8, -14);
            ctx.bezierCurveTo(-2, -14, 2, 14, 8, 14);
            ctx.lineTo(24, 14);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-24, 14);
            ctx.lineTo(-8, 14);
            ctx.bezierCurveTo(-2, 14, 2, -14, 8, -14);
            ctx.lineTo(24, -14);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(16, -20);
            ctx.lineTo(24, -14);
            ctx.lineTo(16, -8);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(16, 8);
            ctx.lineTo(24, 14);
            ctx.lineTo(16, 20);
            ctx.stroke();
            ctx.restore();
        }

        function drawRepeatIcon(centerX, centerY, color, scale) {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(scale, scale);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4.2;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            const width = 36;
            const height = 24;
            const radius = 8;
            ctx.beginPath();
            ctx.moveTo(-width / 2 + radius, -height / 2);
            ctx.lineTo(width / 2 - radius, -height / 2);
            ctx.arcTo(width / 2, -height / 2, width / 2, -height / 2 + radius, radius);
            ctx.lineTo(width / 2, height / 2 - radius);
            ctx.arcTo(width / 2, height / 2, width / 2 - radius, height / 2, radius);
            ctx.lineTo(-width / 2 + radius, height / 2);
            ctx.arcTo(-width / 2, height / 2, -width / 2, height / 2 - radius, radius);
            ctx.lineTo(-width / 2, -height / 2 + radius);
            ctx.arcTo(-width / 2, -height / 2, -width / 2 + radius, -height / 2, radius);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(width / 2 - 12, -height / 2 - 7);
            ctx.lineTo(width / 2 + 2, -height / 2);
            ctx.lineTo(width / 2 - 12, -height / 2 + 7);
            ctx.stroke();
            ctx.restore();
        }

        function drawPlaceholder(x, y, size) {
            ctx.save();
            const gradient = ctx.createLinearGradient(x, y, x + size, y + size);
            gradient.addColorStop(0, "#F2F5F7");
            gradient.addColorStop(1, "#E3E8EC");
            ctx.fillStyle = gradient;
            ctx.fillRect(x, y, size, size);
            ctx.restore();
        }

        function isLightColor(hex) {
            const value = String(hex || "").replace("#", "");
            if (value.length !== 6) return true;
            const red = parseInt(value.slice(0, 2), 16);
            const green = parseInt(value.slice(2, 4), 16);
            const blue = parseInt(value.slice(4, 6), 16);
            return (0.2126 * red + 0.7152 * green + 0.0722 * blue) > 180;
        }

        function mixHexColors(first, second, ratio = 0.5) {
            const parse = (hex) => {
                const value = String(hex || "").replace("#", "");
                if (value.length !== 6) return [255, 255, 255];
                return [
                    parseInt(value.slice(0, 2), 16),
                    parseInt(value.slice(2, 4), 16),
                    parseInt(value.slice(4, 6), 16),
                ];
            };
            const left = parse(first);
            const right = parse(second);
            const amount = Math.max(0, Math.min(1, ratio));
            return "#" + left.map((channel, index) =>
                Math.round(channel + (right[index] - channel) * amount)
                    .toString(16).padStart(2, "0")
            ).join("").toUpperCase();
        }

        function render() {
            const width = canvas.width;
            const height = canvas.height;
            const scale = width / 1080;
            const marginX = 76 * scale;
            const contentWidth = width - marginX * 2;
            const jacketSize = contentWidth;
            const infoH = 140 * scale;
            const progressH = 120 * scale;
            const controlsH = 180 * scale;
            const paletteH = 170 * scale;
            const totalContentH = jacketSize + infoH + progressH + controlsH + paletteH;
            const jacketY = Math.max(100 * scale, (height - totalContentH) / 2);
            const activePalette = palette.length >= 5 ? palette.slice(0, 5) : DEFAULT_PALETTE;
            const backgroundColor = mixHexColors(activePalette[0], activePalette[1], 0.5);
            const lightBackground = isLightColor(backgroundColor);
            const textColor = lightBackground ? "#2C3236" : "#F5FAFC";
            const subTextColor = lightBackground
                ? "rgba(44, 50, 54, 0.62)"
                : "rgba(245, 250, 252, 0.72)";
            const trackColor = lightBackground
                ? "rgba(44, 50, 54, 0.15)"
                : "rgba(245, 250, 252, 0.25)";

            // 每次重绘都隔离 Canvas 状态，避免上一次绘制留下的 textAlign 等属性造成错位。
            ctx.save();
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = backgroundColor;
            ctx.fillRect(0, 0, width, height);
            ctx.textAlign = "left";
            ctx.textBaseline = "top";

            ctx.save();
            ctx.beginPath();
            ctx.rect(marginX, jacketY, jacketSize, jacketSize);
            ctx.clip();
            if (sourceImage.naturalWidth && sourceImage.naturalHeight) {
                const imageScale = Math.max(
                    jacketSize / sourceImage.naturalWidth,
                    jacketSize / sourceImage.naturalHeight,
                );
                const imageWidth = sourceImage.naturalWidth * imageScale;
                const imageHeight = sourceImage.naturalHeight * imageScale;
                ctx.drawImage(
                    sourceImage,
                    marginX + (jacketSize - imageWidth) / 2,
                    jacketY + (jacketSize - imageHeight) / 2,
                    imageWidth,
                    imageHeight,
                );
            } else {
                drawPlaceholder(marginX, jacketY, jacketSize);
            }
            ctx.restore();

            const infoY = jacketY + jacketSize + 56 * scale;
            ctx.fillStyle = textColor;
            ctx.font = `700 ${Math.round(56 * scale)}px CustomFont, sans-serif`;
            ctx.textBaseline = "top";
            const title = fitText(titleText, contentWidth - 90 * scale, 3 * scale);
            drawSpacedText(title, marginX, infoY, 3 * scale);
            drawHeartIcon(marginX + contentWidth - 36 * scale, infoY + 12 * scale, textColor, scale);

            ctx.fillStyle = subTextColor;
            ctx.font = `500 ${Math.round(34 * scale)}px CustomFont, sans-serif`;
            ctx.fillText(artistText || "Unknown Artist", marginX, infoY + 76 * scale);

            const progressY = infoY + 140 * scale;
            const currentProgress = contentWidth * 0.22;
            ctx.fillStyle = trackColor;
            ctx.fillRect(marginX, progressY, contentWidth, 4 * scale);
            ctx.fillStyle = textColor;
            ctx.fillRect(marginX, progressY, currentProgress, 4 * scale);
            ctx.beginPath();
            ctx.arc(marginX + currentProgress, progressY + 2 * scale, 8 * scale, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = subTextColor;
            ctx.font = `400 ${Math.round(24 * scale)}px Helvetica, Arial, sans-serif`;
            ctx.textAlign = "left";
            ctx.fillText("0:42", marginX, progressY + 36 * scale);
            ctx.textAlign = "right";
            ctx.fillText("4:18", marginX + contentWidth, progressY + 36 * scale);
            ctx.textAlign = "left";

            const controlsY = progressY + 140 * scale;
            const centerX = width / 2;
            const playRadius = 82 * scale;
            ctx.beginPath();
            ctx.arc(centerX, controlsY, playRadius, 0, Math.PI * 2);
            ctx.strokeStyle = textColor;
            ctx.lineWidth = 5.5 * scale;
            ctx.stroke();
            ctx.fillStyle = textColor;
            ctx.beginPath();
            ctx.moveTo(centerX - 13 * scale, controlsY - 24 * scale);
            ctx.lineTo(centerX + 23 * scale, controlsY);
            ctx.lineTo(centerX - 13 * scale, controlsY + 24 * scale);
            ctx.closePath();
            ctx.fill();
            drawPrevIcon(centerX - 210 * scale, controlsY, textColor, scale);
            drawNextIcon(centerX + 210 * scale, controlsY, textColor, scale);
            drawShuffleIcon(centerX - 380 * scale, controlsY, subTextColor, scale);
            drawRepeatIcon(centerX + 380 * scale, controlsY, subTextColor, scale);

            const paletteY = controlsY + 160 * scale;
            ctx.fillStyle = subTextColor;
            ctx.font = `500 ${Math.round(18 * scale)}px CustomFont, sans-serif`;
            const paletteTitle = "COLOR PALETTE";
            const titleGap = 6 * scale;
            const titleWidth = spacedWidth(paletteTitle, titleGap);
            drawSpacedText(paletteTitle, centerX - titleWidth / 2, paletteY, titleGap);

            const barY = paletteY + 36 * scale;
            const barHeight = 14 * scale;
            const barWidth = contentWidth / activePalette.length;
            activePalette.forEach((hex, index) => {
                const x = marginX + index * barWidth;
                ctx.fillStyle = hex;
                ctx.fillRect(x, barY, barWidth, barHeight);
                ctx.fillStyle = subTextColor;
                ctx.font = `500 ${Math.round(18 * scale)}px CustomFont, sans-serif`;
                const label = String(hex || "").toUpperCase();
                const hexGap = 2 * scale;
                const labelWidth = spacedWidth(label, hexGap);
                drawSpacedText(label, x + barWidth / 2 - labelWidth / 2, barY + barHeight + 28 * scale, hexGap);
            });

            ctx.fillStyle = subTextColor;
            ctx.font = `500 ${Math.round(24 * scale)}px CustomFont, sans-serif`;
            ctx.textAlign = "center";
            ctx.fillText(signature, centerX, Math.max(paletteY + 140 * scale, height - 76 * scale));
            ctx.restore();
        }

        function renderWhenReady() {
            render();
            const fontReady = document.fonts && document.fonts.ready
                ? document.fonts.ready
                : Promise.resolve();
            fontReady.then(render);
        }

        if (sourceImage.complete) {
            renderWhenReady();
        } else {
            sourceImage.addEventListener("load", renderWhenReady, { once: true });
            sourceImage.addEventListener("error", renderWhenReady, { once: true });
        }
    </script>
</body>
</html>
